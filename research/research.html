	<head>
		<title>科学研究</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="icon" href="../logo.jpg" type="image/jpeg">
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

		<style>
			.note-section {
				margin-top: 3rem;
			}

			.note-section h2 {
				margin-bottom: 1rem;
			}

			.main-card {
				border: 1px solid #eeeeee;
				padding: 1.5rem;
				margin: 2rem 0 1rem 0;
				text-align: center;
				cursor: pointer;
				transition: 0.3s ease;
				position: relative;
			}

			.main-card:hover {
				background: #f7f7f7;
			}

			.main-card::after {
				content: "▼";
				position: absolute;
				right: 1.5rem;
				top: 50%;
				transform: translateY(-50%);
				transition: 0.3s ease;
			}

			.main-card.expanded::after {
				transform: translateY(-50%) rotate(180deg);
			}

			.sub-card-grid {
				display: none;
				grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
				gap: 1.5rem;
				margin-bottom: 2rem;
			}

			.sub-card-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
			gap: 1.5rem;
			margin-bottom: 0;

			max-height: 0;
			opacity: 0;
			transform: translateY(-10px);
			overflow: hidden;
			pointer-events: none;

			transition:
				max-height 0.6s ease,
				opacity 0.4s ease,
				transform 0.4s ease,
				margin-bottom 0.4s ease;
			}

			.sub-card-grid.show {
				max-height: 800px;
				opacity: 1;
				transform: translateY(0);
				margin-bottom: 2rem;
				pointer-events: auto;
			}

			.sub-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
			}

			.sub-card img {
				width: 100%;
				height: 150px;
				object-fit: cover;
				margin-bottom: 1rem;
			}

			.sub-card h3 {
				margin: 0;
				font-size: 1rem;
			}
		</style>
	</head>

	<body class="is-preload">

			<header id="header">
			</header>

				<ul class="links">

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

		<script>
			function toggleSubCards(cardElement, groupKey) {
				const subGrid = document.querySelector(`.sub-card-grid[data-group="${groupKey}"]`);
				const isExpanded = subGrid.classList.toggle('show');
				cardElement.classList.toggle('expanded');
				localStorage.setItem(`card_expanded_${groupKey}`, isExpanded);
			}

			window.addEventListener('DOMContentLoaded', function() {
				document.querySelectorAll('.main-card').forEach(function(card) {
					const groupKey = card.getAttribute('onclick').match(/'([^']+)'/)[1];
					const subGrid = document.querySelector(`.sub-card-grid[data-group="${groupKey}"]`);

					if (localStorage.getItem(`card_expanded_${groupKey}`) === 'true' && subGrid) {
						card.classList.add('expanded');
						subGrid.classList.add('show');
					}
				});
			});
		</script>

	</body>
